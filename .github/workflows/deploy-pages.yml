name: Deploy Bias Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # BUILD BEFORE TEST, and the reason is worth keeping.
      #
      # This ran `npm test` first, to fail fast on unit tests before spending
      # time on a build. That was right until tests started asserting on the
      # BUILT site — that the feed the head advertises is actually written,
      # that graph.json and the entry rails agree. `dist/` is gitignored, so in
      # CI those tests read nothing and failed, and every deploy for hours
      # ended here with the site never updating while the checks looked like
      # ordinary test failures.
      #
      # The tests skip those assertions when `dist/` is missing, so a fresh
      # clone is not confusing. Building first is what makes them run at all.
      # Rasterising the share cards is 64% of a cold build — 565 cards at
      # ~31ms each, 18 of 28 seconds — and almost none of them change between
      # deploys. The cache is keyed by a hash of each card's SVG, so a card
      # whose entry, verdict or template changed gets a new key and is
      # re-rendered; a stale card cannot be served because it cannot share a
      # key. Restoring it takes a cold build to roughly a third.
      #
      # `restore-keys` matters more than the exact key here: a run whose corpus
      # changed still reuses the previous cache for the 500-odd cards that did
      # not change, instead of starting from empty.
      - uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-${{ hashFiles('src/data/biases/*.json', 'build/cards.mjs') }}
          restore-keys: og-
      - run: npm run build -- --base=${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }} --origin=${{ vars.SITE_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
      - run: npm test
      # The house-style gate, on the two things in docs/VOICE.md that are rules
      # rather than signals: a banned word, or an entry over the em-dash limit.
      # Cheap, and it stops the voice drifting back one commit at a time.
      - run: npm run style -- --strict
      # (The build ran above, before the tests. Kept here in comment form so the
      # deployment notes below stay where somebody looks for them.)
      #
      # Build for the host that ACTUALLY serves this artifact.
      #
      # Until there is a domain, these defaults keep the github.io project path
      # working — where `base` MUST be /<repo>/ or every stylesheet, script and
      # internal link 404s.
      #
      # GOING LIVE ON A CUSTOM DOMAIN — three steps, in this order:
      #
      #   1. DNS: a CNAME record for the subdomain pointing at
      #      <owner>.github.io.  (Not at the repo, at the user/org host.)
      #   2. Repository variables:
      #        SITE_BASE   = /
      #        SITE_ORIGIN = https://<the domain>
      #   3. Push. The build writes dist/CNAME from SITE_ORIGIN, which is how
      #      Pages learns the domain. Every deploy replaces the whole artifact,
      #      so that file has to be emitted by the build rather than set once by
      #      hand — otherwise the custom domain silently drops on the next push.
      # Whole-site checks on the assembled output, run against the SAME base and
      # origin the artifact was built with. This is what catches a canonical
      # still pointing at the old host, a sitemap listing a noindex page, or a
      # dead internal link — none of which any unit test can see, and all of
      # which are expensive to find in public. Nothing ships through a failure.
      - run: npm run preflight -- --base=${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }} --origin=${{ vars.SITE_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
      # THE ONE STEP THIS WORKFLOW CANNOT DO FOR ITSELF.
      #
      # Until a human sets Settings -> Pages -> Source to "GitHub Actions",
      # every run fails here, with each earlier check green and a validated
      # artifact thrown away. It looks like a broken deploy and is not one.
      #
      # `enablement: true` is an attempt to create the Pages site from the
      # workflow, and it was tried: it fails with "Create Pages site failed:
      # Resource not accessible by integration". Creating a Pages site needs
      # `administration: write`, and GITHUB_TOKEN cannot be granted that at any
      # permission level — it is the same account-level boundary that stops the
      # repository being created by an integration in the first place.
      #
      # It is kept anyway, for two reasons. On a fork whose token DOES carry the
      # permission it just works, and where it does not, its error names the
      # missing capability outright instead of the bare "Get Pages site failed:
      # Not Found" that replaces it. A pointer beats a puzzle.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The build rewrites src/data/lastmod.json with the hashes for THIS build,
      # so it is the record of which pages actually changed. The IndexNow job
      # runs after deployment in a fresh checkout, so hand it across rather than
      # recomputing it.
      - uses: actions/upload-artifact@v4
        with:
          name: lastmod
          path: src/data/lastmod.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing what changed. Bing's index backs ChatGPT Search and Copilot, so
  # this is the fastest published-to-retrievable path for a large slice of the
  # assistant market. Google does not participate in IndexNow — it declined
  # after evaluating the protocol — so this does nothing there; the sitemap and
  # Search Console remain the only route to Google.
  #
  # OFF BY DEFAULT. This job posts URLs to a third party, which is not something
  # a deploy should start doing on its own. To switch it on, set the repository
  # variable:
  #
  #   INDEXNOW_ENABLED = true
  #
  # Two things must be true first. The key in site.config.json must be served at
  # the DOMAIN ROOT as <key>.txt (the build writes it), and the site must
  # actually be at the origin passed below. On a github.io project path the key
  # file lands under /biases/ rather than at the root, so verification will
  # fail there — this becomes useful at the same moment a custom domain does.
  indexnow:
    needs: deploy
    if: vars.INDEXNOW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: lastmod
          path: src/data/
      - run: node build/indexnow.mjs --base=${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }} --origin=${{ vars.SITE_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
