# Rendered for site `biases` by `python -m engine.onboard build` from site-engine templates/site/rollback.yml.
# Do not edit here: change the template and re-render.
# DEPLOY_ROOT below is the repo variable (the host docroot, the same value as conyso's) plus /biases.
name: engine-rollback

# Manual rollback of one commit: revert it, push the revert, re-deploy the reverted tree, delete only
# the files that commit added, purge, probe. Same scripts and secrets/vars as engine-deploy.yml.
# Jobs: settings (engine code) -> revert (merger app; git only) -> build (NO secrets: the only job that
# runs site code) -> deploy (SSH key; engine code, git and rsync only).
# Copy to .github/workflows/engine-rollback.yml in the site repo and replace SITE_NAME.
#
# Run it from the Actions tab with the commit SHA to undo (the merge/squash commit on main).
# Files the commit modified or deleted come back with the re-deploy. Files it added are removed on
# the server one by one, only inside the remote root and never under the site's protected folders (deploy.protect).

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to roll back'
        required: true
        type: string

permissions:
  contents: write
  issues: write      # open the freeze issue when a rollback fails

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SITE: biases
  ENGINE_REPO: krishnachagti-sudo/site-engine
  ENGINE_REF: ${{ vars.ENGINE_REF || 'main' }}

jobs:
  settings:
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      source: ${{ steps.cfg.outputs.source }}
      build_cmd: ${{ steps.cfg.outputs.build_cmd }}
      install_dir: ${{ steps.cfg.outputs.install_dir }}
      install_cmd: ${{ steps.cfg.outputs.install_cmd }}
      pre_deploy_cmd: ''
      commit_back: ''
      build_image: ${{ steps.cfg.outputs.build_image }}
      build_date_env: ${{ steps.cfg.outputs.build_date_env }}
      build_sh: ${{ steps.build_sh_up.outputs.artifact-id }}
    steps:
      - name: Check the input
        env:
          SHA: ${{ inputs.sha }}
        run: |
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "::error::sha must be 7-40 hex characters"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - id: tip
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read-only token for the engine repo (reader app; its key never leaves this step)
        id: engine_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: krishnachagti-sudo
          repositories: site-engine
          permission-contents: read

      - name: Fetch the engine
        env:
          ENGINE_READ_TOKEN: ${{ steps.engine_token.outputs.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          auth=$(printf 'x-access-token:%s' "$ENGINE_READ_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 --branch "$ENGINE_REF" \
            "https://github.com/$ENGINE_REPO" "$RUNNER_TEMP/engine"
          echo "ENGINE=$RUNNER_TEMP/engine" >> "$GITHUB_ENV"
          pip install -q -e "$RUNNER_TEMP/engine"

      - name: Site settings from the engine config
        id: cfg
        run: |
          cd "$ENGINE"   # engine Python never runs from the site checkout
          # source, build_dir, build_cmd, install_dir, pre_deploy_cmd, base_path, host_root, has_rewrites;
          # the site's rsync exclude list and the files its build rewrites, for deploy.sh
          python -I -m engine.deploy.profile --site "$SITE" --sites-dir "$ENGINE/sites" \
            --excludes-out "$RUNNER_TEMP/work/excludes.txt" --ignore-out "$RUNNER_TEMP/work/dirty_ignore.txt" \
            --commit-back-out "$RUNNER_TEMP/work/commit_back.txt" \
            --github-output "$GITHUB_OUTPUT"
          echo "DEPLOY_EXCLUDE_FILE=$RUNNER_TEMP/work/excludes.txt" >> "$GITHUB_ENV"
          echo "DEPLOY_IGNORE_DIRTY_FILE=$RUNNER_TEMP/work/dirty_ignore.txt" >> "$GITHUB_ENV"
          echo "COMMIT_BACK_FILE=$RUNNER_TEMP/work/commit_back.txt" >> "$GITHUB_ENV"
          # the host's /robots.txt belongs to the host-root site; a subfolder site never compares it
          python -I -m engine.deploy.profile --site "$SITE" --sites-dir "$ENGINE/sites" \
            | sed -n 's/^host_root=/HOST_ROOT=/p' >> "$GITHUB_ENV"

      - name: The engine's tools (its shared build recipe), for the secret-less build job (the gate runs the same one)
        run: mkdir -p "$RUNNER_TEMP/engine-tools" && cp -R "$ENGINE/tools/." "$RUNNER_TEMP/engine-tools/"

      - id: build_sh_up
        uses: actions/upload-artifact@v4
        with:
          name: engine-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-tools/
          if-no-files-found: error
          retention-days: 3


  revert:
    # merger app + engine code + git; no site code
    needs: settings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      rb_artifact_id: ${{ steps.rb_up.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.settings.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read-only token for the engine repo (reader app; its key never leaves this step)
        id: engine_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: krishnachagti-sudo
          repositories: site-engine
          permission-contents: read

      - name: Fetch the engine
        env:
          ENGINE_READ_TOKEN: ${{ steps.engine_token.outputs.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          auth=$(printf 'x-access-token:%s' "$ENGINE_READ_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 --branch "$ENGINE_REF" \
            "https://github.com/$ENGINE_REPO" "$RUNNER_TEMP/engine"
          echo "ENGINE=$RUNNER_TEMP/engine" >> "$GITHUB_ENV"
          pip install -q -e "$RUNNER_TEMP/engine"

      - name: Site settings from the engine config
        id: cfg
        run: |
          cd "$ENGINE"   # engine Python never runs from the site checkout
          # source, build_dir, build_cmd, install_dir, pre_deploy_cmd, base_path, host_root, has_rewrites;
          # the site's rsync exclude list and the files its build rewrites, for deploy.sh
          python -I -m engine.deploy.profile --site "$SITE" --sites-dir "$ENGINE/sites" \
            --excludes-out "$RUNNER_TEMP/work/excludes.txt" --ignore-out "$RUNNER_TEMP/work/dirty_ignore.txt" \
            --commit-back-out "$RUNNER_TEMP/work/commit_back.txt" \
            --github-output "$GITHUB_OUTPUT"
          echo "DEPLOY_EXCLUDE_FILE=$RUNNER_TEMP/work/excludes.txt" >> "$GITHUB_ENV"
          echo "DEPLOY_IGNORE_DIRTY_FILE=$RUNNER_TEMP/work/dirty_ignore.txt" >> "$GITHUB_ENV"
          echo "COMMIT_BACK_FILE=$RUNNER_TEMP/work/commit_back.txt" >> "$GITHUB_ENV"
          # the host's /robots.txt belongs to the host-root site; a subfolder site never compares it
          python -I -m engine.deploy.profile --site "$SITE" --sites-dir "$ENGINE/sites" \
            | sed -n 's/^host_root=/HOST_ROOT=/p' >> "$GITHUB_ENV"

      - name: Push token for the revert commit (merger app, contents:write on this repo only)
        id: merger
        if: vars.MERGER_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MERGER_APP_ID }}
          private-key: ${{ secrets.MERGER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Revert the commit on top of main and plan the remote clean-up
        env:
          SHA: ${{ inputs.sha }}
          PUSH_TOKEN: ${{ steps.merger.outputs.token || github.token }}
          GIT_AUTHOR_NAME: ${{ vars.ROLLBACK_ACTOR || 'site-engine' }}
          GIT_COMMITTER_NAME: ${{ vars.ROLLBACK_ACTOR || 'site-engine' }}
          RUN_ID: ${{ github.run_id }}
          BUILD_DIR: ${{ steps.cfg.outputs.source }}
          TIP: ${{ needs.settings.outputs.sha }}
        run: |
          W="$RUNNER_TEMP/work"
          cd "$ENGINE"   # engine Python never runs from the site checkout
          # A manual rollback has no added.txt, so it removes nothing from the server: files the
          # commit added stay until deleted by hand. A fetch failure or conflict stops the run here.
          if ! python -I -m engine.deploy.rollback revert --site "$SITE" --sites-dir "$ENGINE/sites" --repo "$GITHUB_WORKSPACE" --sha "$SHA" --run-id "$RUN_ID" \
              --plan-out "$W/plan.json" --paths-out "$W/rb_paths.txt" --build-dir "$BUILD_DIR" \
              > "$W/revert.out" 2> "$W/revert.err"; then
            cat "$W/revert.err" >&2
            exit 1
          fi
          cat "$W/revert.err" >&2
          jq -r '.restore[]' "$W/plan.json" > "$W/restored.txt"
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/rb"
          git update-ref refs/engine/revert HEAD
          git bundle create "$RUNNER_TEMP/rb/revert.bundle" "$TIP..refs/engine/revert"
          cp "$W/plan.json" "$W/rb_paths.txt" "$W/restored.txt" "$RUNNER_TEMP/rb/"

      - id: rb_up
        uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rb/
          if-no-files-found: error
          retention-days: 3

  build:
    # NO secrets and no app key: site code (install, build, mart_ready.py) runs only here
    needs: [settings, revert]
    if: always() && needs.revert.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.up.outputs.artifact-id }}
      mart_ready: ${{ steps.mart.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.settings.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.revert.outputs.rb_artifact_id }}
          path: ${{ runner.temp }}/rb

      - name: Check out the reverted tree (from the deploy job's bundle)
        run: |
          art() { if [ -e "$1/$2" ]; then echo "$1"; return; fi; for d in "$1"/*/; do if [ -e "$d$2" ]; then echo "${d%/}"; return; fi; done; echo "$1"; }   # download-by-id may nest files under the artifact name
          R=$(art "$RUNNER_TEMP/rb" revert.bundle)
          git fetch -q "$R/revert.bundle" refs/engine/revert:refs/engine/revert
          git checkout -q --detach refs/engine/revert
          echo "RB=$R" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: needs.settings.outputs.install_dir != ''
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        if: needs.settings.outputs.build_cmd != ''
        with:
          artifact-ids: ${{ needs.settings.outputs.build_sh }}
          path: ${{ runner.temp }}/sb

      - name: Install and build with the engine's shared build script (the gate's image, install, network-less build and date)
        if: needs.settings.outputs.build_cmd != ''
        env:
          BUILD_CMD: ${{ needs.settings.outputs.build_cmd }}
          INSTALL_DIR: ${{ needs.settings.outputs.install_dir }}
          INSTALL_CMD: ${{ needs.settings.outputs.install_cmd }}
          BUILD_IMAGE: ${{ needs.settings.outputs.build_image }}
          BUILD_DATE_ENV: ${{ needs.settings.outputs.build_date_env }}
        run: |
          art() { if [ -e "$1/$2" ]; then echo "$1"; return; fi; for d in "$1"/*/; do if [ -e "$d$2" ]; then echo "${d%/}"; return; fi; done; echo "$1"; }   # download-by-id may nest files under the artifact name
          SB="$(art "$RUNNER_TEMP/sb" site_build.sh)/site_build.sh"
          # tools/site_build.sh is exactly what the gate's measure job ran on base and head
          export BUILD_DATE=$(TZ=Asia/Kolkata date +%F)
          bash "$SB" install .
          bash "$SB" build .

      - name: Is Conyso Mart ready (mart_ready.py runs here, never next to the deploy key)
        id: mart
        run: |
          r=true
          if [ -f mart_ready.py ]; then python3 -I mart_ready.py >&2 || r=false; fi
          echo "ready=$r" >> "$GITHUB_OUTPUT"

      - name: Package the built tree and the files the build rewrote (data for the deploy job)
        if: needs.settings.outputs.build_cmd != ''
        env:
          SOURCE: ${{ needs.settings.outputs.source }}
          REWRITES: ${{ needs.settings.outputs.commit_back }}
        run: |
          mkdir -p "$RUNNER_TEMP/out/rewrites"
          tar -czf "$RUNNER_TEMP/out/built.tgz" --exclude=./.git --exclude=./.engine-deps -C "$SOURCE" .
          for p in $REWRITES; do
            if [ -f "$p" ] && [ ! -L "$p" ]; then mkdir -p "$RUNNER_TEMP/out/rewrites/$(dirname "$p")"; cp "$p" "$RUNNER_TEMP/out/rewrites/$p"; fi
          done

      - id: up
        if: needs.settings.outputs.build_cmd != ''
        uses: actions/upload-artifact@v4
        with:
          name: rollback-build-manual-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 3

  deploy:
    # SSH key, Cloudflare, reader app; engine code, git and rsync only
    needs: [settings, revert, build]
    if: always() && needs.revert.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}/biases
      DEPLOY_IDENTITY: ~/.ssh/deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.settings.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.revert.outputs.rb_artifact_id }}
          path: ${{ runner.temp }}/rb

      - name: Check out the reverted tree (from the revert job's bundle)
        run: |
          art() { if [ -e "$1/$2" ]; then echo "$1"; return; fi; for d in "$1"/*/; do if [ -e "$d$2" ]; then echo "${d%/}"; return; fi; done; echo "$1"; }   # download-by-id may nest files under the artifact name
          R=$(art "$RUNNER_TEMP/rb" revert.bundle)
          git fetch -q "$R/revert.bundle" refs/engine/revert:refs/engine/revert
          git checkout -q --detach refs/engine/revert
          echo "RB=$R" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read-only token for the engine repo (reader app; its key never leaves this step)
        id: engine_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: krishnachagti-sudo
          repositories: site-engine
          permission-contents: read

      - name: Fetch the engine
        env:
          ENGINE_READ_TOKEN: ${{ steps.engine_token.outputs.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          auth=$(printf 'x-access-token:%s' "$ENGINE_READ_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 --branch "$ENGINE_REF" \
            "https://github.com/$ENGINE_REPO" "$RUNNER_TEMP/engine"
          echo "ENGINE=$RUNNER_TEMP/engine" >> "$GITHUB_ENV"
          pip install -q -e "$RUNNER_TEMP/engine"

      - name: Site settings from the engine config
        id: cfg
        run: |
          cd "$ENGINE"   # engine Python never runs from the site checkout
          # source, build_dir, build_cmd, install_dir, pre_deploy_cmd, base_path, host_root, has_rewrites;
          # the site's rsync exclude list and the files its build rewrites, for deploy.sh
          python -I -m engine.deploy.profile --site "$SITE" --sites-dir "$ENGINE/sites" \
            --excludes-out "$RUNNER_TEMP/work/excludes.txt" --ignore-out "$RUNNER_TEMP/work/dirty_ignore.txt" \
            --commit-back-out "$RUNNER_TEMP/work/commit_back.txt" \
            --github-output "$GITHUB_OUTPUT"
          echo "DEPLOY_EXCLUDE_FILE=$RUNNER_TEMP/work/excludes.txt" >> "$GITHUB_ENV"
          echo "DEPLOY_IGNORE_DIRTY_FILE=$RUNNER_TEMP/work/dirty_ignore.txt" >> "$GITHUB_ENV"
          echo "COMMIT_BACK_FILE=$RUNNER_TEMP/work/commit_back.txt" >> "$GITHUB_ENV"
          # the host's /robots.txt belongs to the host-root site; a subfolder site never compares it
          python -I -m engine.deploy.profile --site "$SITE" --sites-dir "$ENGINE/sites" \
            | sed -n 's/^host_root=/HOST_ROOT=/p' >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        if: needs.settings.outputs.build_cmd != ''
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/built

      - name: Where the deploy reads from (the built tree from the build job, else the checkout)
        env:
          SOURCE: ${{ steps.cfg.outputs.source }}
          BUILT: ${{ needs.settings.outputs.build_cmd != '' }}
        run: |
          art() { if [ -e "$1/$2" ]; then echo "$1"; return; fi; for d in "$1"/*/; do if [ -e "$d$2" ]; then echo "${d%/}"; return; fi; done; echo "$1"; }   # download-by-id may nest files under the artifact name
          if [ "$BUILT" = "true" ]; then
            # data only, nothing from it is executed; outside the checkout, so the checkout is never touched
            B=$(art "$RUNNER_TEMP/built" built.tgz)
            D="$RUNNER_TEMP/site-built"
            mkdir -p "$D"
            tar -xzf "$B/built.tgz" -C "$D" --no-same-owner --no-same-permissions
            find "$D" -type l -delete
          else
            D="$GITHUB_WORKSPACE/$SOURCE"
          fi
          echo "DEPLOY_DIR=$D" >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # Only the pinned host is trusted: the job cannot be pointed at an impostor.
          printf 'Host deploy\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_USER" > ~/.ssh/config

      - name: Re-deploy the reverted tree
        env:
          BUILD_DIR: ${{ steps.cfg.outputs.source }}
          DEPLOY_MART_READY: ${{ needs.build.outputs.mart_ready || 'false' }}
        run: bash "$ENGINE/engine/deploy/deploy.sh" "$DEPLOY_DIR" "$DEPLOY_ROOT"

      - name: Remove only the files that commit added
        env:
          BUILD_DIR: ${{ steps.cfg.outputs.source }}
        run: |
          cd "$ENGINE"   # engine Python never runs from the site checkout
          python -I -m engine.deploy.rollback execute --plan "$RB/plan.json" --remote-root "$DEPLOY_ROOT" --tree-dir "$DEPLOY_DIR" \
            --site "$SITE" --sites-dir "$ENGINE/sites"

      - name: Clear the Cloudways app cache (origin Varnish holds HTML for days)
        if: vars.CLOUDWAYS_APP_ID != ''
        continue-on-error: true
        env:
          CLOUDWAYS_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
          CLOUDWAYS_API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
          CLOUDWAYS_SERVER_ID: ${{ vars.CLOUDWAYS_SERVER_ID }}
          CLOUDWAYS_APP_ID: ${{ vars.CLOUDWAYS_APP_ID }}
        run: cd "$ENGINE" && python -I -m engine.deploy.cloudways_purge

      - name: Purge Cloudflare's cache
        if: vars.CF_ZONE_ID != ''
        env:
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          cd "$ENGINE"   # engine Python never runs from the site checkout
          R="$RB"
          python -I -m engine.deploy.urls --site "$SITE" --sites-dir "$ENGINE/sites" --kind purge --changed "$R/rb_paths.txt" > "$R/rb_purge.txt"
          python -I -m engine.deploy.cf_purge --urls-file "$R/rb_purge.txt"

      - name: Wait for the edge
        run: sleep 60

      - name: Probe the live pages
        env:
          BUILD_DIR: ${{ steps.cfg.outputs.source }}
        run: |
          cd "$ENGINE"   # engine Python never runs from the site checkout
          R="$RB"
          python -I -m engine.deploy.urls --site "$SITE" --sites-dir "$ENGINE/sites" --repo-root "$GITHUB_WORKSPACE" \
            --kind verify --changed "$R/restored.txt" --build-dir "$DEPLOY_DIR" > "$R/verify_urls.txt"
          ROBOTS_ARG=""; [ "$HOST_ROOT" = "true" ] && ROBOTS_ARG=1
          python -I -m engine.deploy.verify_live --site "$SITE" --sites-dir "$ENGINE/sites" \
            --urls-file "$R/verify_urls.txt" ${ROBOTS_ARG:+--robots-file "$DEPLOY_DIR/robots.txt"}

  freeze:
    needs: [settings, revert, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open the freeze issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          W="$RUNNER_TEMP/work"
          mkdir -p "$W"
          gh label create engine:freeze --color B60205 --description "engine: freeze site to observe-only" --force || true
          {
            echo "Manual rollback of $SHA failed."
            echo "Run: $RUN_URL"
            echo "A failed revert job means nothing was rolled back or deleted; see the run's logs."
          } > "$W/freeze_body.md"
          gh issue create --title "engine: freeze $SITE" --label engine:freeze --body-file "$W/freeze_body.md"
